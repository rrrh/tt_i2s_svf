yaml_version: 6
project:
  author: "Audio Filter ASIC Developer"
  tiles: "1x2"
  title: "Multiplierless State Variable Filter (SVF) Audio Chip"
  language: "Verilog"
  description: "An oversampled, multiplierless audio filter core featuring dynamic SPI register control and bidirectional I2S audio interfaces targeting the IHP SG13G PDK."
  
  # Include your single or multiple verilog files
  source_files:
    - "tt_um_audio_filter.v"
    - "audio_filter_core.v"
    - "svf_multiplierless_os.v"
    - "spi_reg_bank.v"
    - "i2s_rx.v"
    - "i2s_tx.v"
    
  # The top-level module name in your Verilog code
  top_module: "tt_um_audio_filter"
  
  # The clock frequency your design targets (50 MHz system clock)
  clock_hz: 50000000

# Define the physical pin mappings for Tiny Tapeout
pinout:
  ui[0]: "i2s_ws"      
  ui[1]: "i2s_sck"     
  ui[2]: "i2s_sd_in"   
  ui[3]: "spi_cs_n"    
  ui[4]: "spi_sck"     
  ui[5]: "spi_mosi"    
  ui[6]: "none"        
  ui[7]: "none"        

  uo[0]: "i2s_sd_out"  # single multiplexed output
  uo[1]: "none"   
  uo[2]: "none"   
  uo[3]: "none"   
  uo[4]: "spi_miso"    
  uo[5]: "none"        
  uo[6]: "none"        
  uo[7]: "none"

  # --- Bidirectional Pins (uio_*) ---
  uio[0]: "none"
  uio[1]: "none"
  uio[2]: "none"
  uio[3]: "none"
  uio[4]: "none"
  uio[5]: "none"
  uio[6]: "none"
  uio[7]: "none"
